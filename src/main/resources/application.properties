server.port=${PORT:8080}
server.shutdown=graceful

spring.application.name=bakchodbrain

# ==============================================================================
# Java 21 Virtual Threads (Project Loom)
# ==============================================================================
spring.threads.virtual.enabled=true

# ==============================================================================
# Database Configuration:
# Default: Local MySQL (bakchodbrain_db)
# Fallback: In-memory H2 (for zero-config dev/test)
# Cloud: Render PostgreSQL (auto-detected via DATABASE_URL)
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/bakchodbrain_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.generate-ddl=true
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ==============================================================================
# BakchodBrain Specific Security & Admin Keys
# ==============================================================================
bakchod.admin.key=${ADMIN_SECRET_KEY:bakchodadmin69}
