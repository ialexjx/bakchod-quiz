<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#080a11" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Brain icon paths -->
  <g filter="url(#neonGlow)">
    <path d="M 22 20 C 18 16 12 20 12 26 C 9 27 8 32 10 36 C 8 40 10 45 15 47 C 17 50 22 50 25 47 C 27 48 30 46 31 43 C 31 40 31 22 22 20 Z" 
          fill="url(#brainGrad)" opacity="0.9" />
    <path d="M 42 20 C 46 16 52 20 52 26 C 55 27 56 32 54 36 C 56 40 54 45 49 47 C 47 50 42 50 39 47 C 37 48 34 46 33 43 C 33 40 33 22 42 20 Z" 
          fill="url(#brainGrad)" opacity="0.9" />
  </g>

  <!-- Inner brain sulci lines -->
  <path d="M 20 28 Q 25 32 20 38" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 44 28 Q 39 32 44 38" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Savage Central Lightning Bolt -->
  <polygon points="34,13 26,30 33,30 30,49 41,28 34,28" fill="url(#boltGrad)" filter="url(#neonGlow)"/>
</svg>
